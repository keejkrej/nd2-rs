[package]
name = "nd2"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
description = "Fast, memory-efficient, pure Rust reader for Nikon ND2 microscopy files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/keejkrej/nd2-rs"
homepage = "https://github.com/keejkrej/nd2-rs"
documentation = "https://docs.rs/nd2"
readme = "README.md"
keywords = ["microscopy", "nd2", "nikon", "bioimaging", "image"]
categories = ["science", "multimedia::images", "parser-implementations"]
include = [
    "src/**/*",
    "tests/*.rs",
    "examples/**/*",
    "scripts/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
thiserror = "1.0"
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
flate2 = "1.0"

[dev-dependencies]
